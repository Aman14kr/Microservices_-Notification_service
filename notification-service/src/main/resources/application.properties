spring.application.name=notification-service


spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.consumer.group-id=notification-group
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer

spring.kafka.consumer.properties[spring.json.trusted.packages]=com.example.notificationservice.model
spring.kafka.consumer.properties[spring.json.value.default.type]=com.example.notificationservice.model.EmployeeMessage
spring.kafka.consumer.properties[spring.json.use.type.headers]=false
